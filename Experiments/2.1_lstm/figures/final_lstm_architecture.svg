<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#66758c"/></marker></defs><rect width="1800" height="1250" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17283f}.title{font-size:38px;font-weight:700}.subtitle{font-size:21px;fill:#52647a}.head{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#52647a}.tag{font-size:16px;font-weight:700;letter-spacing:2px;fill:#54708d}.edge{fill:none;stroke:#66758c;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}</style>
<text x="60" y="65" class="title">Final LSTM recommendation model</text>
<text x="60" y="105" class="subtitle">Improved run 2.1.3 | selected epoch 6 | candidate-aware history encoding + freshness-adjusted ranking</text>
<path d="M510 320 H580" class="edge"/>
<polygon points="577,320 564,313 564,327" fill="#66758c"/>
<path d="M510 610 H580" class="edge"/>
<polygon points="577,610 564,603 564,617" fill="#66758c"/>
<path d="M1060 315 H1150" class="edge"/>
<polygon points="1147,315 1134,308 1134,322" fill="#66758c"/>
<path d="M1060 605 H1100 V415 H1150" class="edge"/>
<polygon points="1147,415 1134,408 1134,422" fill="#66758c"/>
<path d="M1060 640 H1150" class="edge"/>
<polygon points="1147,640 1134,633 1134,647" fill="#66758c"/>
<path d="M1435 450 V540" class="edge"/>
<polygon points="1435,537 1428,524 1442,524" fill="#66758c"/>
<path d="M1060 810 H1115 V685 H1150" class="edge"/>
<polygon points="1147,685 1134,678 1134,692" fill="#66758c"/>
<path d="M1435 720 V790" class="edge"/>
<polygon points="1435,787 1428,774 1442,774" fill="#66758c"/>
<path d="M1435 920 V1010" class="edge"/>
<polygon points="1435,1007 1428,994 1442,994" fill="#66758c"/>
<rect x="60" y="180" width="450" height="540" rx="18" fill="#eef5ff" stroke="#a9c4e9" stroke-width="2"/>
<text x="85" y="215" class="tag">01  SHARED ARTICLE ENCODER</text>
<text x="85" y="258" class="head">Same weights for history</text>
<text x="85" y="289" class="head">and candidate articles</text>
<text x="85" y="335" class="body">Frozen text vector: 768 → 64</text>
<text x="85" y="373" class="body">Frozen image vector: 1024 → 32</text>
<text x="85" y="411" class="body">Category embedding: 16</text>
<text x="85" y="449" class="body">Article-type embedding: 8</text>
<text x="85" y="487" class="body">Mean-pooled topic embedding: 16</text>
<text x="85" y="525" class="body">Article numeric features: 9</text>
<path d="M85 550 H485" stroke="#bfd1e8"/>
<text x="85" y="583" class="body">Concatenate: 145 dimensions</text>
<text x="85" y="621" class="body">Linear 145 → 128 + ReLU</text>
<text x="85" y="659" class="body">LayerNorm → article vector (128)</text>
<text x="85" y="698" class="small">Missing vectors masked; availability flags</text>
<rect x="580" y="180" width="480" height="270" rx="18" fill="#ffffff" stroke="#c8d4e1" stroke-width="2"/>
<text x="605" y="215" class="tag">02  CHRONOLOGICAL USER HISTORY</text>
<text x="605" y="258" class="head">Latest 50 pre-period events</text>
<text x="605" y="298" class="body">Article vector (128) + event features (8)</text>
<text x="605" y="336" class="body">Linear 136 → 128 + ReLU + dropout</text>
<text x="605" y="374" class="body">Single-layer LSTM: 128 hidden units</text>
<text x="605" y="416" class="small">All hidden states H: up to 50 × 128</text>
<rect x="580" y="540" width="480" height="180" rx="18" fill="#eef5ff" stroke="#a9c4e9" stroke-width="2"/>
<text x="605" y="575" class="tag">03  CANDIDATE ARTICLE</text>
<text x="605" y="617" class="head">Candidate vector c: 128</text>
<text x="605" y="656" class="body">Query projection: 128 → 32</text>
<text x="605" y="693" class="small">Also passed directly to prediction head</text>
<rect x="1150" y="180" width="590" height="270" rx="18" fill="#f1edff" stroke="#c9b9ef" stroke-width="2"/>
<text x="1175" y="215" class="tag">04  TARGET-AWARE ATTENTION</text>
<text x="1175" y="258" class="body">Candidate query q (32) + history keys (32)</text>
<text x="1175" y="299" class="body">eₜ = q · kₜ / √32 + β × recency gap zₜ</text>
<text x="1175" y="340" class="body">Masked softmax over valid history events</text>
<text x="1175" y="381" class="body">Weighted sum: u = Σ αₜ hₜ → 128</text>
<text x="1175" y="421" class="small">Learned fallback vector for empty histories</text>
<rect x="1150" y="540" width="590" height="180" rx="18" fill="#f1edff" stroke="#c9b9ef" stroke-width="2"/>
<text x="1175" y="575" class="tag">05  FEATURE FUSION</text>
<text x="1175" y="615" class="body">Candidate c (128) + attended history u (128)</text>
<text x="1175" y="652" class="body">64-d projected product + scaled dot (1)</text>
<text x="1175" y="690" class="body">+ candidate features (2) + context (22) = 345</text>
<rect x="580" y="760" width="480" height="160" rx="18" fill="#ffffff" stroke="#c8d4e1" stroke-width="2"/>
<text x="605" y="795" class="tag">PRE-REQUEST INPUTS</text>
<text x="605" y="836" class="body">Log age + missing-age flag (2)</text>
<text x="605" y="877" class="body">Request / user context features (22)</text>
<rect x="1150" y="790" width="590" height="130" rx="18" fill="#ffffff" stroke="#c8d4e1" stroke-width="2"/>
<text x="1175" y="825" class="tag">06  PREDICTION NETWORK</text>
<text x="1175" y="864" class="body">MLP: 345 → 256 → 128 → 1</text>
<text x="1175" y="899" class="small">ReLU + dropout after each hidden layer</text>
<text x="60" y="798" class="tag">TRAINING</text>
<text x="60" y="839" class="small">BCEWithLogitsLoss on recorded slates</text>
<text x="60" y="873" class="small">Clicked = 1; shown but unclicked = 0</text>
<text x="60" y="915" class="small">Hidden-layer dropout: 0.2803</text>
<text x="60" y="949" class="small">Candidate text dropout: 20% (training)</text>
<rect x="580" y="1010" width="1160" height="135" rx="18" fill="#e9f7ef" stroke="#a4d4b7" stroke-width="2"/>
<text x="605" y="1045" class="tag">07  FINAL RANKING SCORE</text>
<text x="605" y="1083" class="head">score = neural logit − 2.0 × log(1 + article age in hours)</text>
<text x="605" y="1122" class="body">Rank eligible articles → top 100 shortlist; retain top 200 including reserve</text>
<text x="60" y="1200" class="small">Attention recency bias β is learned. Final freshness weight 2.0 is selected on validation. Ranking scores are uncalibrated.</text>
</svg>